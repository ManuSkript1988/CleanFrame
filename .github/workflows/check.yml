name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run check:tools
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      # Compares Standard at 100 % with the reference commit in scripts/typography-reference.json.
      # It needs that commit's objects; fetch-depth: 0 above provides the full history.
      - run: npm run check:typography
      - run: npm run export:public
